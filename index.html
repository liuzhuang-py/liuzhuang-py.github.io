<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业肝 · qigan电子</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%232dd4bf' stroke-width='2'/%3E%3Crect x='14' y='14' width='4' height='4' fill='%232dd4bf'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --line: #d8dde3;
    --line-strong: #c2cad3;
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-soft: #ccfbf1;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 8px 24px -8px rgba(15,23,42,0.12);
    --shadow-lg: 0 16px 40px -12px rgba(13,148,136,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(15,23,42,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  /* 背景光斑 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(13,148,136,0.18), transparent 70%);
    top: -120px; right: -100px;
  }
  body::after {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(45,212,191,0.14), transparent 70%);
    bottom: -100px; left: -80px;
  }
  .wrap {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  /* ===== 加载动画 ===== */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up {
    opacity: 0;
    animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .d1 { animation-delay: .05s; }
  .d2 { animation-delay: .15s; }
  .d3 { animation-delay: .28s; }
  .d4 { animation-delay: .42s; }
  .d5 { animation-delay: .56s; }

  /* ===== 终端窗口外壳 ===== */
  .terminal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #f8fafc;
    border-bottom: 1px solid var(--line);
  }
  .term-bar .lights {
    display: flex; gap: 6px;
  }
  .term-bar .lights span {
    width: 11px; height: 11px; border-radius: 50%;
    display: inline-block;
  }
  .lights .r { background: #ff5f57; }
  .lights .y { background: #febc2e; }
  .lights .g { background: #28c840; }
  .term-bar .title {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    margin-left: 8px;
  }
  .term-bar .badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 99px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .term-bar .badge::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(.8); }
  }

  .term-body {
    padding: 36px 36px 32px;
  }

  /* 品牌行 */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .brand .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 2px;
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(13,148,136,0.15);
  }

  /* 标题区 */
  h1 {
    font-size: clamp(44px, 9vw, 68px);
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 14px;
  }
  h1 .accent {
    background: linear-gradient(120deg, var(--accent) 0%, #14b8a6 60%, #2dd4bf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink-2);
    min-height: 22px;
  }
  .tagline::before {
    content: "$ ";
    color: var(--accent);
    font-weight: 600;
  }
  .tagline .typed {
    color: var(--ink);
  }
  .tagline .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .tagline .cursor, .term-bar .badge::before { animation: none; }
    .fade-up { animation: none; opacity: 1; }
    * { transition: none !important; }
  }

  /* ===== 产品网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), #2dd4bf);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .25s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
  }
  .card:hover::before { transform: scaleX(1); }

  .card .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .card .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-dark);
    flex-shrink: 0;
    transition: transform .2s ease;
  }
  .card:hover .icon { transform: scale(1.08) rotate(-3deg); }
  .card .icon svg { width: 22px; height: 22px; }
  .card .idx {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
  }
  .card h3 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .card p {
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.65;
    margin-bottom: 20px;
    flex: 1;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--ink);
    padding: 11px 16px;
    min-height: 42px;
    border-radius: 8px;
    transition: background .18s ease, transform .18s ease;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn .arrow { transition: transform .18s ease; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .btn.ghost:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* 通栏卡片 */
  .card.wide {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 22px 24px;
  }
  .card.wide .info {
    flex: 1;
    min-width: 220px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .card.wide .txt { flex: 1; }
  .card.wide h3 { margin-bottom: 4px; }
  .card.wide p { margin-bottom: 0; }
  .card.wide .btn { flex-shrink: 0; min-width: 170px; }
  .card.wide .icon {
    background: #fef3c7;
    color: #b45309;
  }
  .card.wide:hover .icon { background: #fde68a; }

  /* ===== 底部 ===== */
  footer {
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 4px;
  }
  footer a {
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px dotted var(--line-strong);
    transition: color .15s ease;
  }
  footer a:hover { color: var(--accent); }
  .stats {
    display: flex;
    gap: 14px;
    color: var(--ink-3);
  }
  .stats b { color: var(--ink-2); font-weight: 600; }

  /* 移动端 */
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 20px 14px; }
    .term-body { padding: 26px 22px; }
    h1 { font-size: 44px; }
    .card.wide { flex-direction: column; align-items: stretch; }
    .card.wide .btn { width: 100%; }
    .stats { width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>
  <main class="wrap">

    <!-- 终端窗口 -->
    <div class="terminal fade-up d1">
      <div class="term-bar">
        <div class="lights"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <span class="title">qigan@desktop: ~/workspace</span>
        <span class="badge">online</span>
      </div>
      <div class="term-body">
        <div class="brand">
          <span class="dot"></span>
          qigan电子
        </div>
        <h1>作业<span class="accent">肝</span></h1>
        <div class="tagline">
          <span class="typed" id="typed"></span><span class="cursor"></span>
        </div>
      </div>
    </div>

    <!-- 产品卡片 -->
    <section class="grid">

      <article class="card fade-up d2">
        <div class="head">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <line x1="8" y1="6" x2="16" y2="6"/>
              <line x1="8" y1="11" x2="8" y2="11"/>
              <line x1="12" y1="11" x2="12" y2="11"/>
              <line x1="16" y1="11" x2="16" y2="11"/>
              <line x1="8" y1="15" x2="8" y2="15"/>
              <line x1="12" y1="15" x2="12" y2="15"/>
              <line x1="16" y1="15" x2="13" y2="18"/>
            </svg>
          </div>
          <span class="idx">01 / tool</span>
        </div>
        <h3>启肝计算器</h3>
        <p>命令行计算器工具，前往 GitHub Releases 下载可用版本。</p>
        <a class="btn" href="https://github.com/liuzhuang-py/CLIcalc/releases" target="_blank" rel="noopener">
          Releases <span class="arrow">→</span>
        </a>
      </article>

      <article class="card fade-up d3">
        <div class="head">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          <span class="idx">02 / system</span>
        </div>
        <h3>qiganos</h3>
        <p>qigan 自制操作系统，前往 GitHub Releases 下载镜像与发行包。</p>
        <a class="btn" href="https://github.com/liuzhuang-py/qiganos/releases/" target="_blank" rel="noopener">
          Releases <span class="arrow">→</span>
        </a>
      </article>

      <article class="card wide fade-up d4">
        <div class="info">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="12" x2="10" y2="12"/>
              <line x1="8" y1="10" x2="8" y2="14"/>
              <line x1="15" y1="13" x2="15.01" y2="13"/>
              <line x1="18" y1="11" x2="18.01" y2="11"/>
              <rect x="2" y="6" width="20" height="12" rx="2"/>
            </svg>
          </div>
          <div class="txt">
            <span class="idx" style="margin-bottom:6px; display:inline-block;">03 / games</span>
            <h3>游戏合集</h3>
            <p>打开 games.html，进入小游戏合集。</p>
          </div>
        </div>
        <a class="btn ghost" href="games.html">
          前往 games.html <span class="arrow">→</span>
        </a>
      </article>

    </section>

    <footer class="fade-up d5">
      <span>© qigan电子 · 2026</span>
      <div class="stats">
        <span>PV <b id="busuanzi_value_site_pv">—</b></span>
        <span>UV <b id="busuanzi_value_site_uv">—</b></span>
        <a href="https://github.com/liuzhuang-py" target="_blank" rel="noopener">@qigansoft</a>
      </div>
    </footer>
  </main>

  <!-- 打字机效果 -->
  <script>
    (function () {
      var phrases = ['ls ./releases', './build.sh --release', 'sudo make install', 'echo "hello, world"'];
      var el = document.getElementById('typed');
      var pi = 0, ci = 0, deleting = false;
      function tick() {
        var phrase = phrases[pi];
        if (!deleting) {
          ci++;
          el.textContent = phrase.slice(0, ci);
          if (ci === phrase.length) {
            deleting = true;
            setTimeout(tick, 1800);
            return;
          }
          setTimeout(tick, 90);
        } else {
          ci--;
          el.textContent = phrase.slice(0, ci);
          if (ci === 0) {
            deleting = false;
            pi = (pi + 1) % phrases.length;
            setTimeout(tick, 400);
            return;
          }
          setTimeout(tick, 45);
        }
      }
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        el.textContent = 'ls ./releases';
      } else {
        tick();
      }
    })();
  </script>

  <!-- 不蒜子访问统计 -->
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
