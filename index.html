<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业肝 · qigan电子</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%232dd4bf' stroke-width='2'/%3E%3Crect x='14' y='14' width='4' height='4' fill='%232dd4bf'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --line: #d8dde3;
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(15,23,42,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 760px;
  }

  /* 品牌行 */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 28px;
    letter-spacing: 0.02em;
  }
  .brand .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 2px;
    display: inline-block;
  }
  .brand .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--ink);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .brand .cursor { animation: none; }
    * { transition: none !important; }
  }

  /* 标题区 */
  h1 {
    font-size: clamp(40px, 8vw, 64px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .tagline {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink-2);
    margin-bottom: 40px;
  }
  .tagline::before {
    content: "$ ";
    color: var(--accent);
  }

  /* 产品网格 */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .card .idx {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .card h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .card p {
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.6;
    margin-bottom: 20px;
    flex: 1;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--ink);
    padding: 12px 16px;
    min-height: 44px;
    border-radius: 6px;
    transition: background .18s ease;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn .arrow {
    transition: transform .18s ease;
  }
  .btn:hover .arrow { transform: translateX(3px); }

  /* 底部 */
  footer {
    margin-top: 36px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--ink-2); text-decoration: none; border-bottom: 1px dotted var(--ink-2); }
  footer a:hover { color: var(--accent); }

  /* 通栏卡片（跳 games.html） */
  .card.wide {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .card.wide .info { flex: 1; min-width: 220px; }
  .card.wide .idx { margin-bottom: 8px; }
  .card.wide p { margin-bottom: 0; }
  .card.wide .btn { flex-shrink: 0; min-width: 180px; }

  /* 移动端 */
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 24px 16px; }
    .card p { font-size: 15px; }
    .btn { font-size: 14px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <span class="dot"></span>
      qigan电子
      <span class="cursor"></span>
    </div>

    <h1>作业肝</h1>
    <div class="tagline">ls ./releases</div>

    <section class="grid">
      <article class="card">
        <div class="idx">01 / tool</div>
        <h3>启肝计算器</h3>
        <p>命令行计算器工具，前往 GitHub Releases 下载可用版本。</p>
        <a class="btn" href="https://github.com/liuzhuang-py/CLIcalc/releases" target="_blank" rel="noopener">
          Releases <span class="arrow">→</span>
        </a>
      </article>

      <article class="card">
        <div class="idx">02 / system</div>
        <h3>qiganos</h3>
        <p>qigan 自制操作系统，前往 GitHub Releases 下载镜像与发行包。</p>
        <a class="btn" href="https://github.com/liuzhuang-py/qiganos/releases/" target="_blank" rel="noopener">
          Releases <span class="arrow">→</span>
        </a>
      </article>

      <article class="card wide">
        <div class="info">
          <div class="idx">03 / games</div>
          <h3>游戏合集</h3>
          <p>打开 games.html，进入小游戏合集。</p>
        </div>
        <a class="btn" href="games.html">
          前往 games.html <span class="arrow">→</span>
        </a>
      </article>
    </section>

    <footer>
      <span>© qigan电子</span>
      <a href="https://github.com/liuzhuang-py" target="_blank" rel="noopener">@qigansoft on GitHub</a>
    </footer>
  </main>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<span id="busuanzi_container_site_pv">
  本站总访问量 <span id="busuanzi_value_site_pv"></span> 次
</span>
<span id="busuanzi_container_site_uv">
  总访客 <span id="busuanzi_value_site_uv"></span> 人
</span>
</body>
</html>
